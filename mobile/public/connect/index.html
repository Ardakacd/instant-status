<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Account | InstantStatus</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      .container {
        text-align: center;
        padding: 20px;
        max-width: 400px;
      }
      .logo {
        font-size: 48px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .button {
        background-color: #0071e3;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: background-color 0.2s;
      }
      .button:hover {
        background-color: #0077ed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">📱</div>
      <h1>Connecting...</h1>
      <p>
        We're opening the InstantStatus app to complete your connection. If
        nothing happens, click the button below.
      </p>

      <a id="openAppButton" href="#" class="button">Open InstantStatus</a>
    </div>

    <script>
      // Prevent multiple redirects
      let hasRedirected = false;

      // Extract userId from URL path
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const userId = pathParts[pathParts.length - 1];

      // Deep link that will open the app if installed
      const deepLink = userId
        ? `instant-status://connect/${userId}`
        : "instant-status://connect";

      // Try to open the app via deep link (only once)
      function attemptRedirect() {
        if (hasRedirected || !userId) return;
        hasRedirected = true;

        // Try to open the app via deep link
        // If app is installed, this will open it
        // If not, the page will stay visible and user can click the button
        window.location.href = deepLink;
      }

      // Initialize page when loaded
      function init() {
        // Set up button
        const button = document.getElementById("openAppButton");
        if (button) {
          if (userId) {
            button.href = deepLink;
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.location.href = deepLink;
            });
          } else {
            button.href = "https://instantstatus.app";
            button.textContent = "Go to InstantStatus";
          }
        }

        // Attempt automatic redirect after a short delay
        if (userId) {
          setTimeout(attemptRedirect, 300);
        }
      }

      // Wait for page to load
      if (document.readyState === "complete") {
        init();
      } else {
        window.addEventListener("load", init);
      }
    </script>
  </body>
</html>
