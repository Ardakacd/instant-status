<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Account | InstantStatus</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10B981" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      .container {
        text-align: center;
        padding: 20px;
        max-width: 400px;
      }
      .logo {
        font-size: 48px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .button {
        background-color: #0071e3;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: background-color 0.2s;
      }
      .button:hover {
        background-color: #0077ed;
      }
      .download-section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e5e5e7;
        width: 100%;
      }
      .download-section p {
        font-size: 14px;
        color: #86868b;
        margin-bottom: 16px;
      }
      .store-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .store-buttons a {
        display: inline-block;
      }
      .store-buttons img {
        height: 44px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">📱</div>
      <h1>Connecting...</h1>
      <p>
        We're opening the InstantStatus app to complete your connection. If
        nothing happens, click the button below.
      </p>

      <a id="openAppButton" href="#" class="button">Open InstantStatus</a>

      <div class="download-section">
        <p>Don't have the app? Download it:</p>
        <div class="store-buttons">
          <!-- Update APP_STORE_ID with your app's numeric ID from App Store Connect -->
          <a id="appStoreLink" href="#" target="_blank" rel="noopener" style="display: none;">
            <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store" style="height: 44px;" />
          </a>
          <a id="playStoreLink" href="https://play.google.com/store/apps/details?id=com.arda.instantstatusapp" target="_blank" rel="noopener" style="display: none;">
            <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" style="height: 44px;" />
          </a>
        </div>
      </div>
    </div>

    <script>
      // Update these when your app is published:
      // - APP_STORE_ID: numeric ID from App Store Connect (e.g. "1234567890")
      // - PLAY_STORE_PACKAGE: Android package name (production may differ from dev)
      const APP_STORE_ID = "YOUR_APP_STORE_ID";
      const PLAY_STORE_PACKAGE = "com.arda.instantstatusapp";

      let hasRedirected = false;

      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const userId = pathParts[pathParts.length - 1];

      const deepLink = userId
        ? `instant-status://connect/${userId}`
        : "instant-status://connect";

      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }
      function isAndroid() {
        return /Android/.test(navigator.userAgent);
      }

      function attemptRedirect() {
        if (hasRedirected || !userId) return;
        hasRedirected = true;
        window.location.href = deepLink;
      }

      function init() {
        const button = document.getElementById("openAppButton");
        if (button) {
          if (userId) {
            button.href = deepLink;
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.location.href = deepLink;
            });
          } else {
            button.href = "https://instantstatus.app";
            button.textContent = "Go to InstantStatus";
          }
        }

        // Show platform-specific download buttons
        const appStoreLink = document.getElementById("appStoreLink");
        const playStoreLink = document.getElementById("playStoreLink");

        if (APP_STORE_ID && APP_STORE_ID !== "YOUR_APP_STORE_ID") {
          appStoreLink.href = `https://apps.apple.com/app/id${APP_STORE_ID}`;
        }
        playStoreLink.href = `https://play.google.com/store/apps/details?id=${PLAY_STORE_PACKAGE}`;

        if (isIOS() && APP_STORE_ID && APP_STORE_ID !== "YOUR_APP_STORE_ID") {
          appStoreLink.style.display = "inline-block";
        }
        if (isAndroid()) {
          playStoreLink.style.display = "inline-block";
        }
        if (!isIOS() && !isAndroid()) {
          if (APP_STORE_ID && APP_STORE_ID !== "YOUR_APP_STORE_ID") appStoreLink.style.display = "inline-block";
          playStoreLink.style.display = "inline-block";
        }

        if (userId) {
          setTimeout(attemptRedirect, 300);
        }
      }

      if (document.readyState === "complete") {
        init();
      } else {
        window.addEventListener("load", init);
      }
    </script>
  </body>
</html>
