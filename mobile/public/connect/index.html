<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Account | InstantStatus</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      .container {
        text-align: center;
        padding: 20px;
        max-width: 400px;
      }
      .logo {
        font-size: 48px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .button {
        background-color: #0071e3;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: background-color 0.2s;
      }
      .button:hover {
        background-color: #0077ed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">📱</div>
      <h1>Connecting...</h1>
      <p>
        We're opening the InstantStatus app to complete your connection. If
        nothing happens, click the button below.
      </p>

      <a href="https://instantstatus.app/connect" class="button"
        >Open InstantStatus</a
      >
    </div>

    <script>
      // Extract userId from URL path
      const pathParts = window.location.pathname.split("/");
      const userId =
        pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

      // Universal link that will open the app if installed
      const universalLink = userId
        ? `https://instantstatus.app/connect/${userId}`
        : "https://instantstatus.app/connect";

      // Try to open the app via universal link
      window.onload = function () {
        // Attempt to redirect to universal link (iOS/Android will intercept if app is installed)
        if (userId) {
          window.location.href = universalLink;
        }
      };
    </script>
  </body>
</html>
