<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | InstantStatus</title>
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 500px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .logo {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #1d1d1f;
      }
      p {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .status-message {
        font-size: 14px;
        color: #86868b;
        margin-top: 20px;
        padding: 12px;
        background-color: #f5f5f7;
        border-radius: 8px;
      }
      .button {
        background-color: #007AFF;
        color: white;
        padding: 14px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        display: inline-block;
        transition: background-color 0.2s;
        margin-top: 8px;
      }
      .button:hover {
        background-color: #0051D5;
      }
      .spinner {
        border: 3px solid #f5f5f7;
        border-top: 3px solid #007AFF;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error {
        color: #ff3b30;
      }
      .success {
        color: #34c759;
      }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="logo">🔒</div>
      <h1 id="title">Resetting Your Password...</h1>
      <p id="message">
        We're opening the InstantStatus app to complete password reset. 
        Please wait a moment...
      </p>
      <div id="spinner" class="spinner"></div>
      <div id="status" class="status-message" style="display: none;"></div>
      <a id="button" href="#" class="button" style="display: none;">
        Open InstantStatus
      </a>
    </div>

    <script>
      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyDPPG_-9OO8PoCt4XoKQEX6hi_8l5j-p54",
        authDomain: "instant-status-8d123.firebaseapp.com",
        projectId: "instant-status-8d123",
        storageBucket: "instant-status-8d123.firebasestorage.app",
        messagingSenderId: "70279102156",
        appId: "1:70279102156:web:28d20293cec8fc2f9c4c69"
      };

      // Initialize Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const auth = firebase.auth();

      // Extract mode and oobCode from URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get("mode");
      const oobCode = urlParams.get("oobCode");

      const titleEl = document.getElementById("title");
      const messageEl = document.getElementById("message");
      const spinnerEl = document.getElementById("spinner");
      const statusEl = document.getElementById("status");
      const buttonEl = document.getElementById("button");

      // Universal link that will open the app if installed
      let universalLink = "https://instantstatus.app/reset-password";
      if (mode && oobCode) {
        universalLink = `https://instantstatus.app/reset-password?mode=${mode}&oobCode=${oobCode}`;
      } else if (mode) {
        universalLink = `https://instantstatus.app/reset-password?mode=${mode}`;
      }

      // Update button href
      buttonEl.href = universalLink;

      // Function to show error state
      function showError(message) {
        titleEl.textContent = "Unable to Reset Password";
        messageEl.textContent = message;
        messageEl.className = "error";
        spinnerEl.style.display = "none";
        statusEl.style.display = "block";
        statusEl.textContent = "If you're having trouble, try opening the link in the InstantStatus app directly.";
        statusEl.className = "status-message error";
        buttonEl.style.display = "inline-block";
      }

      // Function to show success state
      function showSuccess() {
        titleEl.textContent = "Redirecting...";
        messageEl.textContent = "Opening the InstantStatus app to complete password reset.";
        messageEl.className = "success";
        spinnerEl.style.display = "none";
        statusEl.style.display = "block";
        statusEl.textContent = "You can set your new password in the app.";
        statusEl.className = "status-message success";
        buttonEl.style.display = "inline-block";
        buttonEl.textContent = "Open InstantStatus";
      }

      // Function to redirect to app
      function redirectToApp() {
        setTimeout(() => {
          window.location.href = universalLink;
          
          // If we're still here after 2 seconds, show the button
          setTimeout(function() {
            if (document.hasFocus()) {
              messageEl.textContent = "If the app didn't open automatically, click the button below to continue.";
              spinnerEl.style.display = "none";
              buttonEl.style.display = "inline-block";
            }
          }, 2000);
        }, 500);
      }

      window.onload = function () {
        // Check if we have the required parameters for password reset
        if (mode === "resetPassword") {
          // Just redirect to app - password reset will be handled in the app
          showSuccess();
          redirectToApp();
        } else {
          // If not a password reset link, just try to open the app
          console.log("Web: Not a password reset link, attempting to open app directly.");
          redirectToApp();
        }
      };
    </script>
  </body>
</html>
