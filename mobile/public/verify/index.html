<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email | InstantStatus</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 500px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .logo {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #1d1d1f;
      }
      p {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .status-message {
        font-size: 14px;
        color: #86868b;
        margin-top: 20px;
        padding: 12px;
        background-color: #f5f5f7;
        border-radius: 8px;
      }
      .button {
        background-color: #007AFF;
        color: white;
        padding: 14px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        display: inline-block;
        transition: background-color 0.2s;
        margin-top: 8px;
      }
      .button:hover {
        background-color: #0051D5;
      }
      .spinner {
        border: 3px solid #f5f5f7;
        border-top: 3px solid #007AFF;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error {
        color: #ff3b30;
      }
      .success {
        color: #34c759;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">✉️</div>
      <h1 id="title">Verifying Your Email...</h1>
      <p id="message">
        We're opening the InstantStatus app to complete email verification. 
        Please wait a moment...
      </p>
      <div id="spinner" class="spinner"></div>
      <div id="status" class="status-message" style="display: none;"></div>
      <a id="button" href="#" class="button" style="display: none;">
        Open InstantStatus
      </a>
    </div>

    <!-- Firebase config (generated from .env - run scripts/generate-firebase-config.js before deploy) -->
    <script src="/firebase-config.js"></script>
    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getAuth, applyActionCode } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

      const firebaseConfig = window.__FIREBASE_CONFIG__ || {};
      if (!firebaseConfig.apiKey) {
        throw new Error("Firebase config missing. Run: node scripts/generate-firebase-config.js");
      }
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Extract mode and oobCode from URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get("mode");
      const oobCode = urlParams.get("oobCode");

      const titleEl = document.getElementById("title");
      const messageEl = document.getElementById("message");
      const spinnerEl = document.getElementById("spinner");
      const statusEl = document.getElementById("status");
      const buttonEl = document.getElementById("button");

      // Universal link that will open the app if installed
      let universalLink = "https://instantstatus.app/verify";
      if (mode && oobCode) {
        universalLink = `https://instantstatus.app/verify?mode=${mode}&oobCode=${oobCode}`;
      }

      // Update button href
      buttonEl.href = universalLink;

      // Function to show error state
      function showError(message) {
        titleEl.textContent = "Unable to Verify";
        messageEl.textContent = message;
        messageEl.className = "error";
        spinnerEl.style.display = "none";
        statusEl.style.display = "block";
        statusEl.textContent = "If you're having trouble, try opening the link in the InstantStatus app directly.";
        statusEl.className = "status-message error";
        buttonEl.style.display = "inline-block";
      }

      // Function to show success state
      function showSuccess() {
        titleEl.textContent = "Email Verified!";
        messageEl.textContent = "Your email has been successfully verified. Redirecting to app...";
        messageEl.className = "success";
        spinnerEl.style.display = "none";
        statusEl.style.display = "block";
        statusEl.textContent = "Opening InstantStatus app...";
        statusEl.className = "status-message success";
      }

      // Function to redirect to app
      function redirectToApp() {
        // Redirect to universal link (iOS/Android will intercept if app is installed)
        setTimeout(function() {
          window.location.href = universalLink;
          
          // If we're still here after 2 seconds, show the button
          setTimeout(function() {
            if (document.hasFocus()) {
              messageEl.textContent = "If the app didn't open automatically, click the button below to continue.";
              spinnerEl.style.display = "none";
              buttonEl.style.display = "inline-block";
            }
          }, 2000);
        }, 500);
      }

      // Handle verification
      window.onload = async function () {
        // Check if mode is correct
        if (mode && mode !== "verifyEmail") {
          showError("Invalid verification link. Please check your email and try again.");
          return;
        }

        // If we have oobCode, apply it client-side to bypass Firebase's intermediate page
        if (mode === "verifyEmail" && oobCode) {
          try {
            titleEl.textContent = "Verifying Email...";
            messageEl.textContent = "Please wait while we verify your email address...";
            
            // Apply the action code client-side
            await applyActionCode(auth, oobCode);
            
            showSuccess();
            
            // Redirect to app immediately
            redirectToApp();
          } catch (error) {
            console.error("Verification error:", error);
            showError(error.message || "Failed to verify email. Please try again.");
            buttonEl.style.display = "inline-block";
          }
        } else if (mode === "verifyEmail" && !oobCode) {
          // Firebase already processed the code - just redirect to app
          showSuccess();
          redirectToApp();
        } else {
          // No mode or oobCode - might be a direct link
          universalLink = "https://instantstatus.app/verify?mode=verifyEmail";
          redirectToApp();
        }
      };
    </script>
  </body>
</html>
