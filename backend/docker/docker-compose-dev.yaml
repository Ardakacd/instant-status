version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pg_local
    restart: always
    environment:
      POSTGRES_USER: ardakabadayi
      POSTGRES_PASSWORD: 4440
      POSTGRES_DB: instant_status
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_local
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
